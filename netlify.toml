[build]
  command = "npm run install:all && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "/.netlify/functions/api"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**/*.js"]

# Rewrite /api/* to the Express serverless function (single build, production-ready)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback so deep links / refreshes serve the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"